[project]
name = "privacyguard"
version = "1.0.0"
description = "Camera-watched screen privacy guard for Windows: full-screen light effects when a second face appears"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "opencv-python==4.12.0.88",
    "numpy>=1.24",
    "Pillow>=10.0",
]

[project.urls]
Homepage = "https://github.com/sg0928-new/-"

[tool.setuptools]
packages = ["privacyguard", "privacyguard.effects"]
